[package]
name = "itcy-tui"
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
description = "ITCy ratatui status TUI"
default-run = "itcy-tui"

[dependencies]
crossterm = "0.28"
ratatui = "0.29"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
